binary_format/architecture="x86_64"
; One file rather than two. The Windows build shipped as an .exe plus a 303 MB .pck
; that had to travel beside it — send somebody the .exe alone and it does not start,
; which is the easiest possible way to hand out a broken game. macOS has had a
; drag-to-Applications .dmg since 2026-09-17; this is the same idea for Windows.
binary_format/embed_pck=true
